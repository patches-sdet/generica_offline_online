name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install .
    - name: Run tests
      run: pytest tests/ -v --cov=src --cov-report=term-missing
    - name: Check coverage
      run: |
        coverage report
        TOTAL_COV=$(coverage report | grep TOTAL | awk '{print $NF}' | sed 's/%//')
        if [ "$TOTAL_COV" -lt 70 ]; then
          echo "::warning::Code coverage is only ${TOTAL_COV}%, which is below the 70% threshold!"
        fi

  recalculate-benchmark:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install benchmark dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Run recalculate benchmark
      run: |
        mkdir -p benchmark-artifacts
        bash ./run.sh benchmark-recalculate > benchmark-artifacts/recalculate-benchmark.md
        bash ./run.sh benchmark-recalculate --output-json > benchmark-artifacts/recalculate-benchmark.json
    - name: Upload recalculate benchmark artifact
      uses: actions/upload-artifact@v4
      with:
        name: recalculate-benchmark
        path: benchmark-artifacts/
