[project]
name = "generica_offline_online"
version = "0.6.0a1"
description = "Deterministic, effect-driven RPG character engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ryan Hoolehan", email = "ryan.hoolehan@gmail.com" },
    { name = "Andrew Seiple" },
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "coverage[toml]>=7.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
dev = [
    "black>=24.0.0",
    "coverage[toml]>=7.0.0",
    "isort>=5.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "coverage[toml]>=7.0.0",
    "isort>=5.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
